# hyprpaper 0.8 dropped `preload=` and `wallpaper = <monitor>,<path>` for these
# blocks. Paths are resolved against hyprpaper's cwd, which is $HOME when
# hyprland.lua starts it, so they must be absolute; ~ is expanded by hyprpaper.
wallpaper {
    monitor = eDP-1
    path = ~/.config/hypr/files/solarized_triangle.jpg
}

wallpaper {
    monitor = DP-3
    path = ~/.config/hypr/files/solarized_dots.jpg
}
